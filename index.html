<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Application Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.20/dist/full.css" rel="stylesheet"/>
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <!-- css -->
    <link rel="stylesheet" href="style.css">

</head>
<body class="bg-gray-100 font-geist min-h-screen">
    <div class="container mx-auto p-4 max-w-6xl">
        <h1 class="text-2xl lg:text-3xl font-bold mb-6 text-gray-800">Job Application Tracker</h1>

        <!-- Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white shadow rounded-xl p-6">
                <h2 class="text-gray-500">Total</h2>
                <p id="totalCount" class="text-3xl font-bold">0</p>
            </div>
            <div class="bg-white shadow rounded-xl p-6">
                <h2 class="text-gray-500">Interview</h2>
                <p id="interviewCount" class="text-3xl font-bold text-green-600">0</p>
            </div>
            <div class="bg-white shadow rounded-xl p-6">
                <h2 class="text-gray-500">Rejected</h2>
                <p id="rejectedCount" class="text-3xl font-bold text-red-600">0</p>
            </div>
        </div>

        <!-- Section Header -->
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-semibold text-gray-700">Available Jobs</h2>
            <span id="tabCount" class="text-gray-500 font-medium">0 jobs</span>
        </div>

        <!-- Tabs -->
        <div class="flex gap-3 mb-6">
            <button class="tab-btn px-4 py-2 rounded-lg bg-blue-600 text-white" data-tab="all">All</button>
            <button class="tab-btn px-4 py-2 rounded-lg bg-gray-200" data-tab="interview">Interview</button>
            <button class="tab-btn px-4 py-2 rounded-lg bg-gray-200" data-tab="rejected">Rejected</button>
        </div>

        <!-- Jobs Container -->
        <div id="jobsContainer" class="grid gap-6"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
